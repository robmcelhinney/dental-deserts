name: Deploy to GitHub Pages

on:
    push:
        branches: ["main"]
    schedule:
        - cron: "17 4 * * 1"
        - cron: "17 3 1 * *"
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Refresh processed data (best effort)
              id: refresh
              env:
                  NHS_API_SUBSCRIPTION_KEY: ${{ secrets.NHS_API_SUBSCRIPTION_KEY }}
                  REFRESH_REFERENCE_DATA: ${{ github.event.schedule == '17 3 1 * *' }}
              run: |
                  set -euo pipefail
                  test -f data/processed/practices.geojson
                  test -f data/processed/areas.geojson
                  test -f data/processed/area_metrics.json
                  test -f data/processed/qa_report.json

                  if [ -z "${NHS_API_SUBSCRIPTION_KEY}" ]; then
                    echo "::warning::NHS_API_SUBSCRIPTION_KEY is missing; using committed data/processed snapshot."
                    exit 0
                  fi

                  MAX_ATTEMPTS=3
                  build_ok=0
                  backup_dir="$(mktemp -d)"
                  cp -R data/processed/. "${backup_dir}/"
                  refresh_reference_data() {
                    if [ "${REFRESH_REFERENCE_DATA}" = "true" ]; then
                      NOMIS_POPULATION_GEOGRAPHY=TYPE150 python3 scripts/fetch_population.py \
                        && python3 scripts/fetch_imd.py
                    else
                      cp -f data/seed/population.csv data/raw/population.csv \
                        && cp -f data/seed/imd.csv data/raw/imd.csv
                    fi
                  }
                  for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
                    echo "NHS refresh attempt ${attempt}/${MAX_ATTEMPTS}"
                    if python3 scripts/fetch_practices.py \
                      && python3 -c 'import json; rows = json.load(open("data/raw/nhs_practices_normalized.json")); assert rows, "NHS API returned no normalized practices"' \
                      && python3 scripts/fetch_availability.py \
                      && refresh_reference_data \
                      && mkdir -p data/cache \
                      && cp -f data/seed/postcode_lsoa.json data/cache/postcode_lsoa.json \
                      && python3 scripts/enrich_practices_lsoa.py \
                      && python3 scripts/build_data.py \
                      && python3 -c 'import json; metrics = json.load(open("data/processed/area_metrics.json")); assert any(row["practice_count"] for row in metrics.values()), "No practices were assigned to an area"'; then
                      test -f data/processed/practices.geojson
                      test -f data/processed/areas.geojson
                      test -f data/processed/area_metrics.json
                      test -f data/processed/qa_report.json
                      build_ok=1
                      break
                    fi
                    echo "::warning::NHS refresh build failed on attempt ${attempt}; retrying."
                    sleep $((attempt * 5))
                  done

                  if [ "${build_ok}" -ne 1 ]; then
                    rm -rf data/processed
                    mkdir -p data/processed
                    cp -R "${backup_dir}/." data/processed/
                    echo "::warning::NHS refresh failed after retries; restored committed data/processed snapshot."
                  else
                    echo "refreshed=true" >> "${GITHUB_OUTPUT}"
                    echo "NHS refresh succeeded; deploying refreshed data/processed snapshot."
                  fi

            - name: Persist verified data snapshot
              if: steps.refresh.outputs.refreshed == 'true'
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/processed
                  git diff --cached --quiet || git commit -m "data: refresh NHS snapshot"
                  git push

            - name: Validate processed snapshot for deploy
              run: |
                  set -euo pipefail
                  test -f data/processed/practices.geojson
                  test -f data/processed/areas.geojson
                  test -f data/processed/area_metrics.json
                  test -f data/processed/qa_report.json
                  echo "Using data/processed snapshot for deploy."

            - name: Prepare Pages artifact
              run: |
                  mkdir -p _site
                  cp -R frontend/. _site/
                  mkdir -p _site/data
                  cp -R data/processed _site/data/processed

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
